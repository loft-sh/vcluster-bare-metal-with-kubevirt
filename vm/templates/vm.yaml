{{- range .Values.vms }}
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: {{ .bridge }}-{{ .name }}
  namespace: {{ $.Values.namespace }}
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "{{ .bridge }}-{{ .name }}",
      "type": "bridge",
      "bridge": "{{ .bridge }}",
      "isDefaultGateway": false,
      "ipam": {}
    }

---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespace }}
spec:
  runStrategy: {{ if $existing := (lookup "kubevirt.io/v1" "VirtualMachine" $.Values.namespace .name) }}{{ $existing.spec.runStrategy }}{{ else }}Halted{{ end }}
  dataVolumeTemplates:
    - metadata:
        name: {{ .name }}-disk
      spec:
        pvc:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: {{ .disk.size }}
        source:
          blank: {}
  template:
    spec:
      domain:
        cpu:
          cores: {{ .cpu.cores }}
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              macAddress: {{ .mac | quote }}
              bridge: {}
              bootOrder: 1
        resources:
          requests:
            memory: {{ .memory }}
            cpu: {{ .cpu.millicores | quote }}
        firmware:
          bootloader:
            efi:
              secureBoot: false
      networks:
        - name: default
          multus:
            networkName: {{ .bridge }}-{{ .name }}
      volumes:
        - name: rootdisk
          dataVolume:
            name: {{ .name }}-disk
{{- end }}
